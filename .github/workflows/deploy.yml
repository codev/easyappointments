name: Deploy

on:
  push:
    branches: [ openout ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Install Cloudron CLI
        run: npm i -g cloudron

      - name: Log in to Cloudron
        run: cloudron login "${{ secrets.CLOUDRON_SERVER }}" --token "${{ secrets.CLOUDRON_TOKEN }}"

      - name: Run deploy script
        run: cloudron exec --app "${{ secrets.CLOUDRON_APP }}" -- /app/data/deploy.sh
